services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["api"]
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped
